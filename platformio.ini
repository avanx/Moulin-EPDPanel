; PlatformIO Project Configuration File
; Board: ESP32-S3-DevKitM-1, module N16R8 (16MB Flash + 8MB OPI PSRAM)

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; --- EPD panel driver selection --------------------------------------------
; Enable the panel driver(s) to compile in via -DCONFIG_EPD_PANEL_*=1.
; At least one must be on. Disabled drivers compile to empty translation
; units (no Flash/RAM cost). Edit here, then `pio run`.
;   Color QYEG1085RYU579 (B/W/R/Y): -DCONFIG_EPD_PANEL_QYEG1085_COLOR=1
;   Mono  QYEG1085BNF86BF0 (B/W)   : -DCONFIG_EPD_PANEL_QYEG1085_MONO=1
build_flags =
    -DEPD_DEBUG=0
    -DEPD_MASTER_ONLY_TEST=0
    -DCONFIG_EPD_PANEL_QYEG1085_COLOR=1
    -DCONFIG_EPD_PANEL_QYEG1085_MONO=1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
